<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Nexus: Three distinct paths converging at a central decision node -->
  <defs>
    <linearGradient id="nexusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14b8a6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d9488;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="nexusCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#14b8a6;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#0d9488;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f766e;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Three approach paths from distinct directions -->
  <!-- Top path -->
  <path d="M32 8 L32 22" stroke="url(#nexusGrad)" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  
  <!-- Bottom-left path -->
  <path d="M10 56 Q22 40 28 32" stroke="url(#nexusGrad)" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8"/>
  
  <!-- Bottom-right path -->
  <path d="M54 56 Q42 40 36 32" stroke="url(#nexusGrad)" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8"/>
  
  <!-- Convergence ring - the decision boundary -->
  <circle cx="32" cy="32" r="14" fill="none" stroke="url(#nexusGrad)" stroke-width="1.5" opacity="0.3"/>
  
  <!-- Central decision node -->
  <circle cx="32" cy="32" r="7" fill="url(#nexusCore)" opacity="1">
    <animate attributeName="r" values="7;8.5;7" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Three connection points on the core -->
  <circle cx="32" cy="22" r="2.5" fill="url(#nexusGrad)" opacity="0.9"/>
  <circle cx="22" cy="40" r="2.5" fill="url(#nexusGrad)" opacity="0.9"/>
  <circle cx="42" cy="40" r="2.5" fill="url(#nexusGrad)" opacity="0.9"/>
  
  <!-- Data flow indicators - subtle motion toward center -->
  <g stroke="url(#nexusGrad)" stroke-width="1.5" opacity="0.4" stroke-dasharray="4 4">
    <path d="M10 56 Q22 40 28 32">
      <animate attributeName="stroke-dashoffset" values="0;20" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M54 56 Q42 40 36 32">
      <animate attributeName="stroke-dashoffset" values="0;20" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M32 8 L32 22">
      <animate attributeName="stroke-dashoffset" values="0;20" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
