<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Orchestrator: A single stem splitting into three directed paths, guided by a subtle baton from above -->
  <defs>
    <linearGradient id="orchestratorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14b8a6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d9488;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Baton from above - the orchestrator's hand -->
  <path d="M32 4 L32 16" stroke="url(#orchestratorGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <circle cx="32" cy="16" r="3" fill="url(#orchestratorGrad)" opacity="0.8"/>
  
  <!-- Main stem -->
  <path d="M32 16 L32 34" stroke="url(#orchestratorGrad)" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Three directed branches -->
  <path d="M32 34 Q20 44 14 52" stroke="url(#orchestratorGrad)" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.9"/>
  <path d="M32 34 L32 52" stroke="url(#orchestratorGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
  <path d="M32 34 Q44 44 50 52" stroke="url(#orchestratorGrad)" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.9"/>
  
  <!-- Terminal nodes - the agents -->
  <circle cx="14" cy="52" r="3.5" fill="url(#orchestratorGrad)" opacity="0.85"/>
  <circle cx="32" cy="52" r="3.5" fill="url(#orchestratorGrad)" opacity="0.85"/>
  <circle cx="50" cy="52" r="3.5" fill="url(#orchestratorGrad)" opacity="0.85"/>
  
  <!-- Subtle direction indicators on branches -->
  <path d="M22 42 L18 46" stroke="#14b8a6" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <path d="M42 42 L46 46" stroke="#14b8a6" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
</svg>
