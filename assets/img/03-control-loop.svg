<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Control Loop: An open feedback loop - human in the loop, not a closed cage -->
  <defs>
    <linearGradient id="loopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14b8a6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d9488;stop-opacity:1" />
    </linearGradient>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L6,3 Z" fill="url(#loopGrad)"/>
    </marker>
  </defs>
  
  <!-- Open loop - deliberately broken at top (human entry point) -->
  <path d="M16 12 
           A18 18 0 0 1 48 12
           L48 44
           A18 18 0 0 0 16 44
           L16 12" 
        fill="none" stroke="url(#loopGrad)" stroke-width="3.5" 
        stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  
  <!-- Gap at top - the human entry/exit point -->
  <path d="M16 12 A18 18 0 0 1 48 12" 
        fill="none" stroke="#0a0a0b" stroke-width="5" stroke-linecap="round" opacity="1"/>
  
  <!-- Direction arrows on the loop -->
  <path d="M24 12 A18 18 0 0 1 40 12" 
        fill="none" stroke="url(#loopGrad)" stroke-width="2.5" 
        stroke-linecap="round" marker-end="url(#arrowhead)" opacity="0.7"/>
  
  <path d="M16 44 A18 18 0 0 0 32 44" 
        fill="none" stroke="url(#loopGrad)" stroke-width="2.5" 
        stroke-linecap="round" marker-end="url(#arrowhead)" opacity="0.7"/>
  
  <!-- Human node at the gap - the decision point -->
  <circle cx="32" cy="12" r="4.5" fill="#0a0a0b" stroke="url(#loopGrad)" stroke-width="3" opacity="1">
    <animate attributeName="r" values="4.5;5.5;4.5" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Inner pulse - the active loop -->
  <circle cx="32" cy="28" r="8" fill="none" stroke="url(#loopGrad)" stroke-width="1.5" opacity="0.3">
    <animate attributeName="r" values="6;12;6" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>
