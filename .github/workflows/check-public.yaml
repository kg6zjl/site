# The public-repo gate. Nothing here describes the network rather than the mechanism.
#
# This repository is public, so the site is public, and it is the only artifact written *for*
# strangers. Addresses, hostnames, domains and email addresses stay out; describe the
# category instead ("the API server is a host process", "a shared file share on a NAS", "a machine
# called a think-centre").
#
# Product names are fine - public OSS and public services. Naming them is most of what makes the site
# useful to somebody building the same thing.
#
# Same pattern and same exemptions as check:public in the private repo, plus one this repository adds:
# stevearnett.com is this site's own public domain - it redirects here from Cloudflare - so the bare
# domain is the one hostname allowed to appear. Subdomains of it are not: registry.kube and
# kube.stevearnett.com are internal and must never reach this repository. Every other domain is still
# a failure. A failing check is the point: redact at the source rather than widening this pattern.
name: Public scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: public-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Nothing describes the network
        run: |
          status=0
          # The site's own public domain is the one hostname allowed here, so neutralise the bare
          # domain on the way past. The lookbehind matters twice over: without the dot the registry
          # hostname "registry.kube.stevearnett.com" is rewritten too and sails through the gate, and
          # without the at-sign so is your email address.
          matches=$(grep -rEn "([0-9]{1,3}\.){3}[0-9]{1,3}|@[a-z0-9.-]+\.[a-z]{2,}|[a-z0-9.-]+\.(com|net|org|io|local)" \
            --exclude-dir=.git \
            --exclude=check-public.yaml \
            . \
            | perl -pe 's/(?<![a-z0-9.@-])stevearnett\.com/example.org/g' \
            | grep -v "^\S*:[0-9]*:.*\(example\|schema\|w3\.org\|github\|docs\)" || true)
          if [ -n "$matches" ]; then
            echo "FAIL: something in this repository looks like a real address, hostname or domain."
            echo "$matches"
            echo
            echo "Product names are fine. Anything describing THIS network is not."
            status=1
          else
            echo "ok: no network detail"
          fi

          # The scan reads text. A screenshot is pixels, so it cannot see inside one - a value redacted
          # here is still visible in a PNG. Redact at capture time and read the file before committing.
          echo
          echo "note: this scan cannot inspect screenshots. Redact at capture time."
          exit $status